name: Build YouTube Pro

# Every push to main builds all platforms and publishes a GitHub Release.
# To ship an update: change the version (npm run bump -- 0.2.0), commit, push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon public/icon.svg
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "YouTube Pro v__VERSION__"
          releaseDraft: false
          releaseBody: |
            ## Which file is for my device?

            | Device | Download this file |
            |---|---|
            | **Windows** (PC / laptop) | `YouTube.Pro_..._x64-setup.exe` (easiest). `.msi` is for company/IT installs |
            | **Android** (phone / tablet) | `YouTube-Pro-android.apk` |
            | **Mac** (Apple Silicon and Intel) | `YouTube.Pro_..._universal.dmg` |
            | **Linux** (any distro) | `.AppImage` (just run it). Ubuntu/Debian: `.deb`. Fedora/openSUSE: `.rpm` |
            | **iPhone / iPad** | Not available yet (needs Apple signing) |

            Ignore the `.app.tar.gz` file, it is only for developers.

            The app tells you when a new version is out. Tap **Update** inside the app.
          args: ${{ matrix.args }}

  android:
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm install
      - run: npx tauri icon public/icon.svg
      - run: npx tauri android init
      # Debug-signed APK installs on any phone. A Play Store release needs your own signing key.
      - run: npx tauri android build --apk --debug
      - name: Name the APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" YouTube-Pro-android.apk
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          files: YouTube-Pro-android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm install
      - run: npx tauri icon public/icon.svg
      - run: npx tauri ios init
      # Installing on a real iPhone needs your Apple developer signing; see README.
      - run: npx tauri ios build --export-method debugging || echo "iOS needs signing, see README"
